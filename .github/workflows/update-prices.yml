name: Actualizar precios de San Juan

on:
  workflow_dispatch:
  push:
    paths:
      - "update-san-juan.mjs"
      - "san-juan-products.json"
      - ".github/workflows/update-prices.yml"
  schedule:
    - cron: "30 13 * * *"

permissions:
  contents: write

concurrency:
  group: precios-san-juan
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar herramientas de compresión
        run: sudo apt-get update && sudo apt-get install -y unzip zstd p7zip-full

      - name: Recolectar precios oficiales
        env:
          PROVINCE_CODES: AR-J
          OUTPUT_FILE: data/san-juan.ndjson
        run: node update-san-juan.mjs

      - name: Guardar precios actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/san-juan.ndjson
          if git diff --cached --quiet; then
            echo "No hubo cambios en los precios."
          else
            git commit -m "Actualizar precios de San Juan"
            git push
          fi
