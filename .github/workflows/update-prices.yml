name: Actualizar precios de Argentina

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "update-san-juan.mjs"
      - "sepa-provenance.mjs"
      - "sepa-official.mjs"
      - "sepa-source.mjs"
      - "product-identity.mjs"
      - "sepa-values.mjs"
      - "sepa-csv.mjs"
      - "tests/price-refresh-smoke.mjs"
      - "sepa-catalog-controls.mjs"
      - "san-juan-snapshot.mjs"
      - "validate-national-geography.mjs"
      - "scripts/sepa_archive.py"
      - "tests/sepa-provenance.test.mjs"
      - "tests/sepa-official.test.mjs"
      - "tests/test_sepa_archive.py"
      - "scripts/push-generated-data.sh"
      - "scripts/push-update-diagnostics.sh"
      - "national-export.mjs"
      - "price-safety.mjs"
      - "promotion-evidence.mjs"
      - "notify-failed.mjs"
      - "tests/price-safety.test.mjs"
      - "san-juan-products.json"
      - "meat-matcher.mjs"
      - "data/meat-catalog.json"
      - "tests/meat-matcher.test.mjs"
      - "verify-retailer-promotions.mjs"
      - "verify-wallet-benefits.mjs"
      - "tests/wallet-benefits.test.mjs"
      - "notify-completed.mjs"
      - "notification-receipt.mjs"
      - ".github/workflows/update-prices.yml"
  schedule:
    - cron: "30 13 * * *"

permissions:
  contents: write

concurrency:
  group: precios-san-juan
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Keep the explicit replica until official access is resolved and audited.
      SEPA_SOURCE: ${{ vars.SEPA_SOURCE || 'replica' }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizar con la rama principal
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar herramientas de compresión
        run: sudo apt-get update && sudo apt-get install -y unzip zstd p7zip-full

      - name: Instalar navegador para páginas dinámicas
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Probar procedencia, integridad, precios y geografía
        run: |
          npm run check
          python3 -m unittest discover -s tests -p 'test_sepa_archive.py'

      - name: Recolectar precios SEPA y comprobar la fuente seleccionada
        env:
          SEPA_ORIGINAL_DIR: ${{ runner.temp }}/sepa-originals
          NATIONAL_EXPORT: "1"
          PROVINCE_CODES: AR-J
          OUTPUT_FILE: data/san-juan.ndjson
          PROMOTIONS_FILE: data/san-juan-promotions.json
          QUARANTINE_FILE: data/san-juan-quarantine.ndjson
          DESPENSA_INGEST_URL: https://despensa-inteligente.f0d9cc43-9db2-41a1-8976-25cea8b73f32.chatgpt.site/api/prices/ingest
          PRICE_INGEST_TOKEN: ${{ secrets.PRICE_INGEST_TOKEN }}
          BATCH_SIZE: "100"
          BATCH_DELAY_MS: "1000"
          INGEST_RETRIES: "5"
        run: node update-san-juan.mjs

      - name: Conservar evidencia de procedencia aunque falle la carga
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: procedencia-sepa-${{ github.run_id }}
          path: data/sepa-provenance.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Conservar controles de canal y fechas internas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calidad-sepa-${{ github.run_id }}
          path: data/sepa-import-quality.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Conservar ZIP original y evidencia de adquisición
        if: always() && env.SEPA_SOURCE == 'official'
        uses: actions/upload-artifact@v4
        with:
          name: original-sepa-${{ github.run_id }}
          path: ${{ runner.temp }}/sepa-originals/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Validar provincias y coordenadas con Georef
        run: node validate-national-geography.mjs

      - name: Verificar promociones en páginas oficiales
        env:
          PROMOTIONS_FILE: data/san-juan-promotions.json
          RETAILER_REPORT_FILE: data/retailer-promotion-sources.json
          RETAILER_VERIFIED_FILE: data/retailer-promotions-verified.json
          PROMOTION_MAX_AGE_HOURS: "72"
        run: node verify-retailer-promotions.mjs

      - name: Verificar beneficios de Mercado Pago y otras billeteras
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          WALLET_REPORT_FILE: data/wallet-benefit-sources.json
          WALLET_CANDIDATES_FILE: data/wallet-benefit-candidates.json
          WALLET_VERIFIED_FILE: data/wallet-benefits-verified.json
        run: node verify-wallet-benefits.mjs

      - name: Detectar cambios en promociones verificadas
        id: changes
        run: |
          if git diff --quiet -- data/retailer-promotions-verified.json; then
            echo "promotions_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "promotions_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Detectar cambios en beneficios verificados
        id: wallet_changes
        run: |
          if git diff --quiet -- data/wallet-benefits-verified.json; then
            echo "wallet_benefits_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "wallet_benefits_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Guardar precios actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sepa-provenance.json data/sepa-import-quality.json data/national data/national-geography-audit.json data/san-juan.ndjson data/san-juan-quarantine.ndjson data/san-juan-promotions.json data/retailer-promotion-sources.json data/retailer-promotions-verified.json data/wallet-benefit-sources.json data/wallet-benefit-candidates.json data/wallet-benefits-verified.json
          if git diff --cached --quiet; then
            echo "No hubo cambios en los precios."
          else
            git commit -m "Actualizar precios por sucursal y provincia"
            bash scripts/push-generated-data.sh
          fi

      - name: Comprobar que la app lee la actualización publicada
        env:
          SITE_ORIGIN: https://despensa-inteligente.f0d9cc43-9db2-41a1-8976-25cea8b73f32.chatgpt.site
          PRICE_INGEST_TOKEN: ${{ secrets.PRICE_INGEST_TOKEN }}
        run: node tests/price-refresh-smoke.mjs

      - name: Conservar comprobación de lectura en la app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lectura-app-${{ github.run_id }}
          path: data/price-refresh-smoke-report.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Notificar actualización y promociones
        env:
          NOTIFICATION_ENDPOINT: https://despensa-inteligente.f0d9cc43-9db2-41a1-8976-25cea8b73f32.chatgpt.site/api/notifications/process
          PRICE_INGEST_TOKEN: ${{ secrets.PRICE_INGEST_TOKEN }}
          PROMOTIONS_CHANGED: ${{ steps.changes.outputs.promotions_changed }}
          OUTPUT_FILE: data/san-juan.ndjson
          RETAILER_VERIFIED_FILE: data/retailer-promotions-verified.json
          RETAILER_REPORT_FILE: data/retailer-promotion-sources.json
          WALLET_REPORT_FILE: data/wallet-benefit-sources.json
          WALLET_VERIFIED_FILE: data/wallet-benefits-verified.json
          WALLET_BENEFITS_CHANGED: ${{ steps.wallet_changes.outputs.wallet_benefits_changed }}
          NOTIFICATION_RUN_ID: ${{ github.run_id }}
          NOTIFICATION_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node notify-completed.mjs

      - name: Avisar un fallo de actualización
        if: failure()
        env:
          NOTIFICATION_ENDPOINT: https://despensa-inteligente.f0d9cc43-9db2-41a1-8976-25cea8b73f32.chatgpt.site/api/notifications/process
          PRICE_INGEST_TOKEN: ${{ secrets.PRICE_INGEST_TOKEN }}
          NOTIFICATION_RUN_ID: ${{ github.run_id }}
          NOTIFICATION_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node notify-failed.mjs

      - name: Guardar diagnóstico de notificación y lectura de precios
        if: always()
        run: bash scripts/push-update-diagnostics.sh
