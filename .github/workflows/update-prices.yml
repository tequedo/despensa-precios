name: Actualizar precios de Argentina

on:
  workflow_dispatch:
  push:
    paths:
      - "update-san-juan.mjs"
      - "scripts/push-generated-data.sh"
      - "national-export.mjs"
      - "price-safety.mjs"
      - "promotion-evidence.mjs"
      - "notify-failed.mjs"
      - "tests/price-safety.test.mjs"
      - "san-juan-products.json"
      - "meat-matcher.mjs"
      - "data/meat-catalog.json"
      - "tests/meat-matcher.test.mjs"
      - "verify-retailer-promotions.mjs"
      - "verify-wallet-benefits.mjs"
      - "tests/wallet-benefits.test.mjs"
      - "notify-completed.mjs"
      - ".github/workflows/update-prices.yml"
  schedule:
    - cron: "30 13 * * *"

permissions:
  contents: write

concurrency:
  group: precios-san-juan
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizar con la rama principal
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar herramientas de compresión
        run: sudo apt-get update && sudo apt-get install -y unzip zstd p7zip-full

      - name: Instalar navegador para páginas dinámicas
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Probar reglas de precios y geografía
        run: node --test tests/meat-matcher.test.mjs tests/price-safety.test.mjs tests/national-export.test.mjs

      - name: Recolectar precios oficiales
        env:
          NATIONAL_EXPORT: "1"
          PROVINCE_CODES: AR-J
          OUTPUT_FILE: data/san-juan.ndjson
          PROMOTIONS_FILE: data/san-juan-promotions.json
          QUARANTINE_FILE: data/san-juan-quarantine.ndjson
          DESPENSA_INGEST_URL: https://despensa-inteligente.f0d9cc43-9db2-41a1-8976-25cea8b73f32.chatgpt.site/api/prices/ingest
          PRICE_INGEST_TOKEN: ${{ secrets.PRICE_INGEST_TOKEN }}
          BATCH_SIZE: "100"
          BATCH_DELAY_MS: "1000"
          INGEST_RETRIES: "5"
        run: node update-san-juan.mjs

      - name: Validar provincias y coordenadas con Georef
        run: node validate-national-geography.mjs

      - name: Verificar promociones en páginas oficiales
        env:
          PROMOTIONS_FILE: data/san-juan-promotions.json
          RETAILER_REPORT_FILE: data/retailer-promotion-sources.json
          RETAILER_VERIFIED_FILE: data/retailer-promotions-verified.json
          PROMOTION_MAX_AGE_HOURS: "72"
        run: node verify-retailer-promotions.mjs

      - name: Verificar beneficios de Mercado Pago y otras billeteras
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          WALLET_REPORT_FILE: data/wallet-benefit-sources.json
          WALLET_CANDIDATES_FILE: data/wallet-benefit-candidates.json
          WALLET_VERIFIED_FILE: data/wallet-benefits-verified.json
        run: node verify-wallet-benefits.mjs

      - name: Detectar cambios en promociones verificadas
        id: changes
        run: |
          if git diff --quiet -- data/retailer-promotions-verified.json; then
            echo "promotions_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "promotions_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Detectar cambios en beneficios verificados
        id: wallet_changes
        run: |
          if git diff --quiet -- data/wallet-benefits-verified.json; then
            echo "wallet_benefits_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "wallet_benefits_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Guardar precios actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national data/national-geography-audit.json data/san-juan.ndjson data/san-juan-quarantine.ndjson data/san-juan-promotions.json data/retailer-promotion-sources.json data/retailer-promotions-verified.json data/wallet-benefit-sources.json data/wallet-benefit-candidates.json data/wallet-benefits-verified.json
          if git diff --cached --quiet; then
            echo "No hubo cambios en los precios."
          else
            git commit -m "Actualizar precios por sucursal y provincia"
            bash scripts/push-generated-data.sh
          fi

      - name: Notificar actualización y promociones
        env:
          NOTIFICATION_ENDPOINT: https://despensa-inteligente.f0d9cc43-9db2-41a1-8976-25cea8b73f32.chatgpt.site/api/notifications/process
          PRICE_INGEST_TOKEN: ${{ secrets.PRICE_INGEST_TOKEN }}
          PROMOTIONS_CHANGED: ${{ steps.changes.outputs.promotions_changed }}
          OUTPUT_FILE: data/san-juan.ndjson
          RETAILER_VERIFIED_FILE: data/retailer-promotions-verified.json
          RETAILER_REPORT_FILE: data/retailer-promotion-sources.json
          WALLET_REPORT_FILE: data/wallet-benefit-sources.json
          WALLET_VERIFIED_FILE: data/wallet-benefits-verified.json
          WALLET_BENEFITS_CHANGED: ${{ steps.wallet_changes.outputs.wallet_benefits_changed }}
          NOTIFICATION_RUN_ID: ${{ github.run_id }}
          NOTIFICATION_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node notify-completed.mjs

      - name: Avisar un fallo de actualización
        if: failure()
        env:
          NOTIFICATION_ENDPOINT: https://despensa-inteligente.f0d9cc43-9db2-41a1-8976-25cea8b73f32.chatgpt.site/api/notifications/process
          PRICE_INGEST_TOKEN: ${{ secrets.PRICE_INGEST_TOKEN }}
          NOTIFICATION_RUN_ID: ${{ github.run_id }}
          NOTIFICATION_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node notify-failed.mjs

      - name: Guardar diagnóstico de notificación
        if: always()
        run: |
          if [ -f data/notification-status.json ]; then
            git add data/notification-status.json
            if ! git diff --cached --quiet; then
              git commit -m "Actualizar estado de notificación"
              bash scripts/push-generated-data.sh
            fi
          fi

