name: Probar procedencia SEPA sin publicar datos
on:
  push:
    branches: ['fix/sepa-procedencia-4-2', 'fix/sepa-identificacion-4-3']
  pull_request:
    paths: ['sepa-provenance.mjs', 'sepa-official.mjs', 'sepa-source.mjs', 'product-identity.mjs', 'sepa-values.mjs', 'national-export.mjs', 'scripts/**', 'tests/**', 'update-san-juan.mjs', '.github/workflows/test-provenance.yml', '.github/workflows/audit-official-sepa.yml', '.github/workflows/update-prices.yml']
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/data/
            /data/meat-catalog.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd
      - run: npm run check
      - run: python3 -m unittest discover -s tests -p 'test_sepa_archive.py'
