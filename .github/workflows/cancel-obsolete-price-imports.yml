name: Detener cargas anteriores al formato por partes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/cancel-obsolete-price-imports.yml"]
permissions:
  contents: read
  actions: write
jobs:
  detener:
    if: github.repository == 'tequedo/despensa-precios'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancelar únicamente las dos ejecuciones con el formato anterior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for obsolete_run in 40986134552 40987273818; do
            observed_status=$(gh api "repos/tequedo/despensa-precios/actions/runs/$obsolete_run" --jq .status)
            observed_name=$(gh api "repos/tequedo/despensa-precios/actions/runs/$obsolete_run" --jq .name)
            if [ "$observed_name" != "Actualizar precios de Argentina" ]; then
              echo "La ejecución no corresponde al importador esperado." >&2
              exit 1
            fi
            if [ "$observed_status" != "completed" ]; then
              gh api --method POST "repos/tequedo/despensa-precios/actions/runs/$obsolete_run/cancel" --silent
              echo "Cancelación solicitada para $obsolete_run."
            fi
          done
