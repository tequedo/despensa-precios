name: Probar alertas y resumen diario
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "notify-*.mjs"
      - "notification-receipt.mjs"
      - "tests/notification-*.test.mjs"
      - ".github/workflows/*notifications*"
      - ".github/workflows/notify-access.yml"
      - ".github/workflows/update-prices.yml"
      - ".github/workflows/update-wallet-benefits.yml"
  push:
    branches: [main]
    paths:
      - "notify-*.mjs"
      - "notification-receipt.mjs"
      - "tests/notification-*.test.mjs"
      - ".github/workflows/*notifications*"
      - ".github/workflows/notify-access.yml"
      - ".github/workflows/update-prices.yml"
      - ".github/workflows/update-wallet-benefits.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/notification-*.test.mjs
