name: Comprobar voz y fotografía
on:
  workflow_dispatch:
  push:
    paths:
      - "tests/recognition-smoke.mjs"
      - "tests/fixtures/leche-prueba.png"
      - ".github/workflows/test-recognition.yml"
permissions:
  contents: write
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preparar una grabación de prueba
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng
          espeak-ng -v es -s 140 -w voice-qa.wav 'Necesito comprar. Dos paquetes de arroz Gallo de un kilo.'
      - name: Comprobar servicios con muestras sintéticas
        env:
          SITE_ORIGIN: https://despensa-inteligente.f0d9cc43-9db2-41a1-8976-25cea8b73f32.chatgpt.site
          PRICE_INGEST_TOKEN: ${{ secrets.PRICE_INGEST_TOKEN }}
        run: node tests/recognition-smoke.mjs
      - name: Guardar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recognition-smoke-report.json
          git commit -m "Registrar comprobación de reconocimiento"
          bash scripts/push-generated-data.sh
