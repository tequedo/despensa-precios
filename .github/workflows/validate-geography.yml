name: Auditar geografía del catálogo nacional
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: precios-san-juan
  cancel-in-progress: false
jobs:
  auditar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node validate-national-geography.mjs
      - name: Conservar catálogo auditado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national data/national-geography-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Excluir sucursales con provincia y coordenadas incompatibles"
            bash scripts/push-generated-data.sh
          fi
